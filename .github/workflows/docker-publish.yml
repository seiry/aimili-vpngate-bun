name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  build:
    name: Build Native (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp version tag
        id: time_tag
        shell: bash
        run: |
          TAG=$(TZ='Asia/Shanghai' date -d @$(git log -1 --format=%ct) +'%Y-%-m-%-d-%H%M')
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Generated Docker image timestamp tag: ${TAG}"

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.time_tag.outputs.tag }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=aimili-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=aimili-${{ matrix.slug }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest & Trigger Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp version tag
        id: time_tag
        shell: bash
        run: |
          TAG=$(TZ='Asia/Shanghai' date -d @$(git log -1 --format=%ct) +'%Y-%-m-%-d-%H%M')
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Generated Docker image timestamp tag: ${TAG}"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.time_tag.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

      - name: Trigger Coolify Redeploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "${COOLIFY_WEBHOOK}" ]; then
            # Ensure force=true is enabled for fresh container recreation and pull
            TARGET_URL=$(echo "${COOLIFY_WEBHOOK}" | sed 's/force=false/force=true/')
            echo "Triggering Coolify redeploy webhook at ${TARGET_URL}..."
            AUTH_HEADER=()
            if [ -n "${COOLIFY_TOKEN}" ]; then
              AUTH_HEADER=(-H "Authorization: Bearer ${COOLIFY_TOKEN}")
            fi
            response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${AUTH_HEADER[@]}" "${TARGET_URL}" || curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET "${AUTH_HEADER[@]}" "${TARGET_URL}" || true)
            code=$(echo "${response}" | grep "HTTP_STATUS:" | cut -d':' -f2 | tail -n1)
            echo "Coolify response HTTP code: ${code}"
            if [ "${code}" -ge 200 ] && [ "${code}" -lt 400 ]; then
              echo "Coolify redeployment triggered successfully."
            else
              echo "Warning: Coolify webhook returned unexpected status ${code}. Output:"
              echo "${response}"
            fi
          else
            echo "COOLIFY_WEBHOOK_URL secret is not set, skipping automatic redeploy."
          fi
