name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test

  build-and-push:
    name: Build & Publish Multi-Arch Image (amd64, arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp version tag
        id: time_tag
        shell: bash
        run: |
          TAG=$(TZ='Asia/Shanghai' date +'%Y-%-m-%-d-%H%M')
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Generated Docker image timestamp tag: ${TAG}"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.time_tag.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=aimili-multiarch
          cache-to: type=gha,mode=max,scope=aimili-multiarch

      - name: Trigger Coolify Redeploy Webhook
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "${COOLIFY_WEBHOOK}" ]; then
            echo "Triggering Coolify redeploy webhook..."
            AUTH_HEADER=()
            if [ -n "${COOLIFY_TOKEN}" ]; then
              AUTH_HEADER=(-H "Authorization: Bearer ${COOLIFY_TOKEN}")
            fi
            response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${AUTH_HEADER[@]}" "${COOLIFY_WEBHOOK}" || curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET "${AUTH_HEADER[@]}" "${COOLIFY_WEBHOOK}" || true)
            code=$(echo "${response}" | grep "HTTP_STATUS:" | cut -d':' -f2 | tail -n1)
            echo "Coolify response HTTP code: ${code}"
            if [ "${code}" -ge 200 ] && [ "${code}" -lt 400 ]; then
              echo "Coolify redeployment triggered successfully."
            else
              echo "Warning: Coolify webhook returned unexpected status ${code}. Output:"
              echo "${response}"
            fi
          else
            echo "COOLIFY_WEBHOOK_URL secret is not set, skipping automatic redeploy."
          fi
